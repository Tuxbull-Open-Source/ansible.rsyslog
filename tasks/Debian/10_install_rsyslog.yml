---
- name: Install rsyslog on Debian-family systems
  ansible.builtin.apt:
    name: rsyslog
    state: present
    update_cache: true

- name: Render rsyslog forwarding configuration
  ansible.builtin.template:
    src: rsyslog.conf.j2
    dest: "/etc/rsyslog.d/{{ rsyslog_cfg_name }}.conf"
    owner: root
    group: root
    mode: '0644'
    validate: rsyslogd -N1 -f %s
  notify: Restart rsyslog

- name: Enable and start rsyslog
  ansible.builtin.systemd:
    name: rsyslog
    enabled: true
    state: started
